<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TammadaDay Gallery - Live Cloud IG</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet Maps CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            pink: '#ec4899',
                            purple: '#8b5cf6',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React and Babel UMD -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Project Custom Premium styles.css -->
    <link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-animated-gradient min-h-screen text-gray-800 flex justify-center items-center py-0 sm:py-4" id="bg-body">
    <div id="root" class="w-full max-w-lg app-container sm:h-[92vh] sm:rounded-[2.5rem] shadow-2xl overflow-hidden glass-premium flex flex-col relative text-gray-900 dark:text-gray-100"></div>

    <!-- Project Database Core (db.js stub for backward compatibility) -->
    <script src="db.js"></script>

    <!-- Main React App Script (app.js) loaded with Babel UMD module routing -->
    <script type="text/babel" data-type="module" src="app.js"></script>
</body>

</html>
